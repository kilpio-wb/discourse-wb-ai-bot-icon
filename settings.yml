icon_color:
  type: string
  default: "#666666"
  description: "Primary color of the AI bot icon (hex code)"

icon_glow_color:
  type: string
  default: "#BBBBBB"
  description: "Glow color around the icon (hex code)"

icon_bg_color:
  type: string
  default: "#FFFFFF"
  description: "Background circle color behind the icon"

enable_pulse_animation:
  type: bool
  default: true
  description: "Enable a subtle pulse animation to draw attention"

icon_scale:
  type: string
  default: "1.35"
  description: "Scale multiplier for the icon size (e.g. 1.0 = normal, 1.5 = 50% bigger)"

show_greeting_label:
  type: bool
  default: true
  description: "Show a text label next to the icon"

enable_anon_button:
  type: bool
  default: true
  description: "Show a centered 'Ask AI' button for anonymous visitors; clicking opens a log in / sign up dialog instead of the AI bot (which requires an account)"

anon_center_min_width:
  type: integer
  default: 768
  min: 580
  max: 1400
  description: "Anonymous visitors only: below this header width (px) the centered 'Ask AI' button is replaced by a compact bot icon on the right. Raise it if the centered button overlaps the log in / sign up buttons on medium screens; must be >= 580. Logged-in users always switch at 580px."
